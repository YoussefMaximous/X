[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "losslens"
version = "0.1.0"
description = "Local tick store and defect lens for MT4 expert advisors"
requires-python = ">=3.11"
dependencies = ["pyarrow>=14.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0", "mypy>=1.15.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".pytest_tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src/losslens"]
python_version = "3.11"

[[tool.mypy.overrides]]
# pyarrow ships incomplete type information; skip its internals, keep strict on our code.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"
